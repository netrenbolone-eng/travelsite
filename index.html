<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tours</title><meta name="description" content="">
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<header class="top"><a class="brand" href="#top"><span id="logo"></span><b id="company"></b></a>
<nav><a href="#vip" data-i="nav_vip"></a><a href="#tours" data-i="nav_tours"></a><a href="#how" data-i="nav_how"></a><a href="#book" data-i="nav_book"></a></nav>
<select id="lang" aria-label="Language"></select></header>
<main id="top">
<section class="hero"><p class="place" id="place"></p><h1 data-i="hero_title"></h1><p class="sub" data-i="hero_sub"></p>
<div class="row"><a class="btn" href="#book" data-i="cta_book"></a><a class="btn ghost" data-wa data-track="whatsapp_click" data-loc="hero" data-i="cta_wa" target="_blank" rel="noopener"></a></div>
<p class="ans" data-i="ans"></p></section>
<section id="vip" class="sec"><h2 data-i="vip_title"></h2><p class="lead" data-i="vip_sub"></p><div id="premium" class="prem"></div></section>
<section id="tours" class="sec"><h2 data-i="tours_title"></h2><div id="chips" class="chips"></div><div id="grid" class="grid"></div></section>
<section id="how" class="sec how"><h2 data-i="how_title"></h2><ol><li><b data-i="s1"></b><span data-i="s1t"></span></li><li><b data-i="s2"></b><span data-i="s2t"></span></li><li><b data-i="s3"></b><span data-i="s3t"></span></li></ol></section>
<section id="book" class="sec"><h2 data-i="form_title"></h2>
<form id="form" novalidate><label><span data-i="f_tour"></span><select name="tour" id="tour"></select></label>
<label><span data-i="f_date"></span><input type="date" name="date"></label>
<label><span data-i="f_guests"></span><input type="number" name="guests" min="1" value="2"></label>
<label><span data-i="f_name"></span><input name="name" autocomplete="name"></label>
<label><span data-i="f_contact"></span><input name="contact" autocomplete="tel"></label>
<label class="wide"><span data-i="f_msg"></span><textarea name="msg" rows="3"></textarea></label>
<button class="btn" data-i="f_send"></button><p id="status" role="status"></p></form></section>
</main>
<footer class="foot"><span id="fcompany"></span><a data-tel data-track="phone_click" data-loc="footer" id="ftel"></a><a data-mail id="fmail"></a></footer>
<div class="fab"><a data-wa data-track="whatsapp_click" data-loc="float" target="_blank" rel="noopener" aria-label="WhatsApp">WA</a><a data-tg data-track="telegram_click" data-loc="float" target="_blank" rel="noopener" aria-label="Telegram">TG</a><a data-tel data-track="phone_click" data-loc="float" aria-label="Call">☎</a></div>
<script src="config.js"></script><script src="assets/js/app.js"></script></body></html>
